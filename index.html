/* ── API ───────────────────────────────────────────────────── */
const createApi = (url) => ({
  async get(action,params={}){
    try{const r=await fetch(`${url}?action=${action}&${new URLSearchParams(params)}`);return r.json();}
    catch(e){return{error:e.message};}
  },
  async post(action,body={}){
    try{
      const r=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action,...body}),
        redirect:"follow"
      });
      const text=await r.text();
      try{return JSON.parse(text);}catch{return{ok:true};}
    }catch(e){return{error:e.message};}
  }
});
// Helper ghi công nợ — luôn hiện lỗi nếu thất bại
const postDebt = async (api, debt, notify) => {
  if(!api) return; // chế độ local, không cần gọi API
  const res = await api.post("addDebt", debt);
  if(res?.error){
    console.error("[addDebt] lỗi:", res.error, debt);
    if(notify) notify(`⚠️ Lỗi lưu công nợ: ${res.error}`);
  }
};

// ── READ ────────────────────────────────────────────────────
function doGet(e) {
  const ss  = SpreadsheetApp.getActiveSpreadsheet();
  const act = e.parameter.action;
  let result = {};

  if (act === 'getTaiKhoan') {
    result.data = sheet2arr(ss,'TaiKhoan').map(r => ({
      id:String(r[0]),username:String(r[1]),password:String(r[2]),ten:String(r[3]),loai:String(r[4]),sdt:r[5]?String(r[5]):'',diaChi:r[6]?String(r[6]):'',avatar:r[7]?String(r[7]):''
    }));
  }
  else if (act === 'getSanPham') {
    result.data = sheet2arr(ss,'SanPham').map(r => ({
      id:r[0],ten:r[1],gia:+r[2]||0,von:+r[3]||0,nhom:r[4]||'Khác'
    }));
  }
  else if (act === 'getDonHang') {
    const orders = sheet2arr(ss,'DonHang').map(r => ({
      id:r[0],maKH:r[1],tenKH:r[2],ngay:new Date(r[3]).toISOString(),
      trangThai:r[4],tongTien:+r[5]||0,tongVon:+r[6]||0,items:[]
    }));
    const details = sheet2arr(ss,'ChiTietDon');
    orders.forEach(o => {
      o.items = details.filter(d=>d[0]===o.id).map(d=>({
        maSP:d[1],ten:d[2],sl:+d[3]||0,gia:+d[4]||0,von:+d[5]||0,nhom:d[6]||''
      }));
    });
    result.data = orders;
  }
  else if (act === 'getCongNo') {
    result.data = sheet2arr(ss,'CongNo').map(r => ({
      id:r[0],maKH:r[1],tenKH:r[2],soTien:+r[3]||0,loai:r[4],
      ngay:new Date(r[5]).toISOString(),maDon:r[6]||''
    }));
  }

  return json(result);
}

// ── WRITE ───────────────────────────────────────────────────
function doPost(e) {
  try {
  const ss   = SpreadsheetApp.getActiveSpreadsheet();
  const body = JSON.parse(e.postData.contents);
  const act  = body.action;

  if (act === 'createOrder') {
    ss.getSheetByName('DonHang').appendRow([
      body.id,body.maKH,body.tenKH,body.ngay,body.trangThai,body.tongTien,body.tongVon
    ]);
    body.items.forEach(it =>
      ss.getSheetByName('ChiTietDon').appendRow([
        body.id,it.maSP,it.ten,it.sl,it.gia,it.von,it.nhom||''
      ])
    );
  }
  else if (act === 'approveOrder') {
    const sh = ss.getSheetByName('DonHang');
    findAndUpdate(sh, body.id, 5, 'done');
  }
  else if (act === 'addDebt') {
    const sh = ss.getSheetByName('CongNo');
    if(!sh) throw new Error('Sheet CongNo không tồn tại. Hãy chạy initializeSheets()');
    sh.appendRow([
      body.id, body.maKH, body.tenKH,
      Number(body.soTien)||0,
      body.loai, body.ngay, body.maDon||''
    ]);
  }
  else if (act === 'cancelOrder') {
    const sh = ss.getSheetByName('DonHang');
    findAndUpdate(sh, body.id, 5, 'cancelled');
  }
  else if (act === 'addCustomer') {
    ss.getSheetByName('TaiKhoan').appendRow([
      body.id,body.username,body.password,body.ten,body.loai,body.sdt||'',body.diaChi||'',body.avatar||''
    ]);
  }
  else if (act === 'addProduct') {
    ss.getSheetByName('SanPham').appendRow([
      body.id,body.ten,body.gia,body.von,body.nhom||''
    ]);
  }
  else if (act === 'updateUser') {
    const sh = ss.getSheetByName('TaiKhoan');
    const rows = sh.getDataRange().getValues();
    for(let i=1;i<rows.length;i++){
      if(rows[i][0]===body.id){
        if(body.ten!==undefined) sh.getRange(i+1,4).setValue(body.ten||rows[i][3]);
        if(body.sdt!==undefined) sh.getRange(i+1,6).setValue(body.sdt||rows[i][5]);
        if(body.avatar!==undefined) sh.getRange(i+1,8).setValue(body.avatar||'');
        break;
      }
    }
  }

  return json({ok:true});
  } catch(err) {
    return json({error: err.toString(), stack: err.stack});
  }
}

// ── Utils ────────────────────────────────────────────────────
function sheet2arr(ss, name) {
  const sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() <= 1) return [];
  return sh.getRange(2,1,sh.getLastRow()-1,sh.getLastColumn()).getValues()
    .filter(r => r[0] !== '' && r[0] !== null);
}

function findAndUpdate(sh, id, col, value) {
  const rows = sh.getDataRange().getValues();
  for (let i=1; i<rows.length; i++) {
    if (String(rows[i][0])===String(id)) {
      sh.getRange(i+1, col).setValue(value);
      break;
    }
  }
}

function json(data) {
  return ContentService
    .createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ── AVATAR ──────────────────────────────────────────────── */
const AVATAR_COLORS=['#3B82F6','#10B981','#F59E0B','#8B5CF6','#EC4899','#06B6D4','#F97316','#EF4444','#14B8A6','#84CC16'];
const EMOJI_AVATARS=['🐱','🐶','🦊','🐻','🐼','🐨','🐯','🦁','🐸','🐵','🦋','🌸','🌺','🌻','🌹','🍀','⭐','🌙','☀️','🎈','💎','👑','🎀','🌈','🏄','🎸','🍕','🎯','🚀','💫'];

function getAvatarColor(id=''){
  let h=0; for(let ch of String(id)) h=(h*31+ch.charCodeAt(0))%AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
}
function getInitials(ten=''){
  return (ten||'?').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
}

function Avatar({user={},size=36,style:st={},onClick}){
  const av = user.avatar || avatarCache.get(user.id||'') || '';
  const isPhoto = av && av.startsWith('data:');
  const isEmoji = av && !isPhoto;
  const bg = getAvatarColor(user.id||user.ten||'');

  if(isPhoto) return(
    <div onClick={onClick} style={{width:size,height:size,borderRadius:'50%',overflow:'hidden',
      flexShrink:0,cursor:onClick?'pointer':'default',boxShadow:'0 1px 4px rgba(0,0,0,0.15)',...st}}>
      <img src={av} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/>
    </div>
  );
  return(
    <div onClick={onClick} style={{width:size,height:size,borderRadius:'50%',flexShrink:0,
      display:'flex',alignItems:'center',justifyContent:'center',
      background:isEmoji?'#EEF2FF':bg,

// Resize image to square, return base64 JPEG
function resizeImage(file, size=120){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext('2d');
        const min=Math.min(img.width,img.height);
        const sx=(img.width-min)/2, sy=(img.height-min)/2;
        ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  const [showGuide,setShowGuide]=useState(false);
  const login=async()=>{
    if(!u||!p){setErr("Vui lòng nhập đầy đủ");return;}
